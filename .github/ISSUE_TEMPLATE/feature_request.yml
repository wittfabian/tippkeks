name: Feature request
description: Suggest a change or an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you ran into, not the solution yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including "live with it" — knowing why that is not enough helps.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This fits a private prediction game for closed groups (not a public, commercial or betting product).
          required: true
