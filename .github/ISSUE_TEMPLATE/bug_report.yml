name: Bug report
description: Something behaves differently than it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — use private
        reporting under the Security tab instead (see SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a group member
        2. Open …
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit you are running.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - Self-hosted deployment
        - Local development
        - Not sure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Browser, device, screenshots, relevant log lines.
