name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Unit tests run; integration tests self-skip without local Supabase keys
      # (tests/helpers.ts → hasSupabase === false → describe.skip).
      - name: Test
        run: pnpm test

      # Placeholders, not real project values: `next build` Zod-validates the
      # public env but never contacts Supabase, so anything well-formed compiles
      # the same bundle. That keeps CI free of repository configuration — a fork
      # gets a green build with nothing to set up. The service-role key is
      # likewise absent: it is asserted at runtime only, so it can never leak
      # into a build log or artifact.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          NEXT_TELEMETRY_DISABLED: "1"
