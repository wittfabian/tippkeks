name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Unit tests run; integration tests self-skip without local Supabase keys
      # (tests/helpers.ts → hasSupabase === false → describe.skip).
      - name: Test
        run: pnpm test

      # Build env comes from repo Variables (not hardcoded). NEXT_PUBLIC_* are
      # inlined into the client bundle at build time and Zod-validated, so they
      # must be present. The service-role key is deliberately NOT provided: it is
      # only needed at runtime (createServiceClient asserts it then), so keeping
      # the secret out of CI removes any chance of it leaking into a build artifact
      # or log. Configure under Settings → Secrets and variables → Actions:
      # Variables NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_TELEMETRY_DISABLED: "1"
