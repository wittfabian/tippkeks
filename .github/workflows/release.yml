name: Release image

# Manual only — build & publish a production image on demand.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.0.0 or latest)"
        required: true
        default: latest

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase image path.
      - name: Resolve image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Always publish/move :latest alongside the requested tag, so deployments
          # tracking :latest (docker-compose.prod.yml) pick up every release. If the
          # input already is "latest", buildx deduplicates the identical tag.
          tags: |
            ${{ steps.img.outputs.name }}:${{ inputs.tag }}
            ${{ steps.img.outputs.name }}:latest
          # NEXT_PUBLIC_* are inlined into the client bundle at build time. They
          # are not secret (the anon key ships to browsers), so store them as repo
          # *Variables* (Settings → Secrets and variables → Actions → Variables).
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is consumed by `next build` and
          # embedded into the output. It is a genuine secret, so it is passed as a
          # BuildKit secret (mounted, not a build arg → never persists in image
          # layers/history); store it as a repo *Secret*. Pass the SAME value at
          # runtime (see Summary below).
          secrets: |
            next_server_actions_encryption_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Published **${{ steps.img.outputs.name }}:${{ inputs.tag }}** (and updated **:latest**)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run it with the server-only secrets injected at runtime:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker run -p 3000:3000 \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  -e SUPABASE_SERVICE_ROLE_KEY=... \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  -e CRON_SECRET=... \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  -e FOOTBALL_DATA_API_TOKEN=... \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  -e NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=... \\  # SAME value as the build-time secret; embedded at build, must match at runtime" >> "$GITHUB_STEP_SUMMARY"
          echo "  ${{ steps.img.outputs.name }}:${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
