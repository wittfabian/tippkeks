<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Keine Verbindung · TippKeks</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #fbfdfb;
        color: #16201c;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #16201c;
          color: #f4f6f4;
        }
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      svg {
        width: 64px;
        height: 64px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        opacity: 0.8;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.625rem 1.25rem;
        color: #16201c;
        background: #e0a458;
      }
      button:hover {
        background: #d2933f;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="40"
        height="40"
        viewBox="0 0 40 40"
        fill="none"
      >
        <circle cx="20" cy="20" r="17.5" fill="#E0A458" stroke="#B5762E" stroke-width="2" />
        <circle cx="25.5" cy="27" r="1.4" fill="#B5762E" />
        <circle cx="9.5" cy="21.5" r="1.3" fill="#B5762E" />
        <circle cx="24" cy="8.5" r="1.2" fill="#B5762E" />
        <polygon
          points="14.58,9.34 18.14,12.77 15.97,17.21 11.08,16.52 10.23,11.66"
          fill="#26303A"
        />
        <polygon
          points="26.68,13.70 30.38,15.20 30.10,19.19 26.23,20.15 24.11,16.76"
          fill="#26303A"
        />
        <polygon
          points="18.77,24.02 21.20,27.63 18.52,31.06 14.43,29.57 14.58,25.22"
          fill="#26303A"
        />
      </svg>

      <h1>Keine Verbindung</h1>
      <p>TippKeks braucht eine Internetverbindung. Sobald du wieder online bist, geht's weiter.</p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
  </body>
</html>
